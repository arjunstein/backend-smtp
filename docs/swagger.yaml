basePath: /
definitions:
  model.AttachmentDTO:
    properties:
      content_base64:
        example: JVBERi0xLjQK...
        type: string
      content_type:
        example: application/pdf
        type: string
      filename:
        example: invoice.pdf
        type: string
    type: object
  model.AuthResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        example: 3600
        type: integer
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/model.UserResponse'
    type: object
  model.CreateSMTPConfigRequest:
    properties:
      encryption:
        example: STARTTLS
        type: string
      from_email:
        example: no-reply@example.com
        type: string
      from_name:
        example: Notification Agent
        type: string
      host:
        example: smtp.gmail.com
        type: string
      is_active:
        example: true
        type: boolean
      is_default:
        example: false
        type: boolean
      name:
        example: Gmail Service
        type: string
      password:
        example: secret123
        type: string
      port:
        example: 587
        type: integer
      username:
        example: no-reply@example.com
        type: string
    type: object
  model.LoginRequest:
    properties:
      password:
        example: secret123
        type: string
      username_or_email:
        example: arjun
        type: string
    type: object
  model.RefreshTokenRequest:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  model.RefreshTokenResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        example: 3600
        type: integer
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  model.SMTPConfigResponse:
    properties:
      created_at:
        example: "2026-10-20T10:00:00Z"
        type: string
      encryption:
        example: STARTTLS
        type: string
      from_email:
        example: no-reply@example.com
        type: string
      from_name:
        example: Notification Agent
        type: string
      host:
        example: smtp.gmail.com
        type: string
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      is_default:
        example: false
        type: boolean
      name:
        example: Gmail Service
        type: string
      port:
        example: 587
        type: integer
      updated_at:
        example: "2026-10-20T10:00:00Z"
        type: string
      username:
        example: no-reply@example.com
        type: string
    type: object
  model.SendEmailRequest:
    properties:
      attachments:
        items:
          $ref: '#/definitions/model.AttachmentDTO'
        type: array
      bcc:
        example:
        - bcc@example.com
        items:
          type: string
        type: array
      body:
        example: <h1>Hello!</h1><p>Your code is 123456</p>
        type: string
      cc:
        example:
        - cc@example.com
        items:
          type: string
        type: array
      is_html:
        example: true
        type: boolean
      smtp_config_id:
        example: 1
        type: integer
      subject:
        example: Your verification code
        type: string
      to:
        example:
        - recipient@example.com
        items:
          type: string
        type: array
    type: object
  model.SendEmailResponse:
    properties:
      recipients:
        example:
        - recipient@example.com
        items:
          type: string
        type: array
      sent_at:
        example: "2026-10-20T10:00:00Z"
        type: string
      smtp_config_id:
        example: 1
        type: integer
      smtp_name:
        example: Gmail Service
        type: string
      status:
        example: SUCCESS
        type: string
      subject:
        example: Your verification code
        type: string
    type: object
  model.TestConnectionResponse:
    properties:
      status:
        example: CONNECTED
        type: string
    type: object
  model.UpdateSMTPConfigRequest:
    properties:
      encryption:
        example: STARTTLS
        type: string
      from_email:
        example: notifications@mailtrap.io
        type: string
      from_name:
        example: Central Mailer
        type: string
      host:
        example: smtp.mailtrap.io
        type: string
      is_active:
        example: true
        type: boolean
      is_default:
        example: true
        type: boolean
      name:
        example: Updated Service Name
        type: string
      password:
        example: newsecret123
        type: string
      port:
        example: 587
        type: integer
      username:
        example: user@mailtrap.io
        type: string
    type: object
  model.UserResponse:
    properties:
      created_at:
        example: "2026-10-20T10:00:00Z"
        type: string
      email:
        example: arjun@example.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: Arjun Gunawan
        type: string
      username:
        example: arjun
        type: string
    type: object
  response.APIResponse:
    properties:
      data:
        type: any
      error:
        type: any
      message:
        example: Operation completed successfully
        type: string
      success:
        example: true
        type: boolean
    type: object
  response.ConflictResponse:
    properties:
      message:
        example: smtp configuration name already exists
        type: string
      success:
        example: false
        type: boolean
    type: object
  response.ErrorResponse:
    properties:
      error:
        example: name is required
        type: string
      message:
        example: Invalid request payload or validation error
        type: string
      success:
        example: false
        type: boolean
    type: object
  response.HealthResponse:
    properties:
      message:
        example: Service is healthy
        type: string
      success:
        example: true
        type: boolean
    type: object
  response.InternalErrorResponse:
    properties:
      error:
        example: database connection failure
        type: string
      message:
        example: Internal server error
        type: string
      success:
        example: false
        type: boolean
    type: object
  response.NotFoundResponse:
    properties:
      message:
        example: Resource not found
        type: string
      success:
        example: false
        type: boolean
    type: object
  response.SimpleResponse:
    properties:
      message:
        example: Operation completed successfully
        type: string
      success:
        example: true
        type: boolean
    type: object
  response.UnauthorizedResponse:
    properties:
      message:
        example: Invalid or missing API authentication credentials
        type: string
      success:
        example: false
        type: boolean
    type: object
info:
  contact: {}
  description: Production-grade centralized SMTP agent and email sending engine.
  title: Centralized SMTP Email Sender Service
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates credentials and returns a signed JWT token
      parameters:
      - description: User Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully authenticated
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.AuthResponse'
              type: object
        "400":
          description: Invalid input format
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Invalid username/email or password
          schema:
            $ref: '#/definitions/response.UnauthorizedResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.InternalErrorResponse'
      summary: Authenticate user
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      description: Returns the profile of the currently authenticated user using JWT
      produces:
      - application/json
      responses:
        "200":
          description: Current user profile
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.UserResponse'
              type: object
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/response.UnauthorizedResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.InternalErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Uses a valid refresh token to issue a new dynamic access token
        and rotated refresh token
      parameters:
      - description: Refresh Token Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully refreshed tokens
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.RefreshTokenResponse'
              type: object
        "400":
          description: Invalid input format
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Invalid, expired, or wrong token type
          schema:
            $ref: '#/definitions/response.UnauthorizedResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.InternalErrorResponse'
      summary: Refresh access token
      tags:
      - Auth
  /api/v1/emails/send:
    post:
      consumes:
      - application/json
      description: Dispatches an email using the specified SMTP config or the system
        default
      parameters:
      - description: Send email payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/model.SendEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Email successfully dispatched
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.SendEmailResponse'
              type: object
        "400":
          description: Invalid request payload or mail delivery failure
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Invalid or missing API authentication credentials
          schema:
            $ref: '#/definitions/response.UnauthorizedResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.InternalErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Send email via centralized SMTP agent
      tags:
      - Emails
  /api/v1/smtp-configs:
    get:
      description: Returns all registered SMTP configurations with masked credentials
      produces:
      - application/json
      responses:
        "200":
          description: List of SMTP configurations
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.SMTPConfigResponse'
                  type: array
              type: object
        "401":
          description: Invalid or missing API authentication credentials
          schema:
            $ref: '#/definitions/response.UnauthorizedResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.InternalErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: List all SMTP configurations
      tags:
      - SMTP Config
    post:
      consumes:
      - application/json
      description: Registers a new SMTP account for central email delivery
      parameters:
      - description: SMTP configuration payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/model.CreateSMTPConfigRequest'
      produces:
      - application/json
      responses:
        "201":
          description: SMTP configuration created successfully
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.SMTPConfigResponse'
              type: object
        "400":
          description: Invalid request payload or validation error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Invalid or missing API authentication credentials
          schema:
            $ref: '#/definitions/response.UnauthorizedResponse'
        "409":
          description: Configuration name already exists
          schema:
            $ref: '#/definitions/response.ConflictResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.InternalErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Create new SMTP configuration
      tags:
      - SMTP Config
  /api/v1/smtp-configs/{id}:
    delete:
      description: Deletes an SMTP configuration by ID
      parameters:
      - description: SMTP Config ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: SMTP configuration deleted
          schema:
            $ref: '#/definitions/response.SimpleResponse'
        "400":
          description: Invalid ID format
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Invalid or missing API authentication credentials
          schema:
            $ref: '#/definitions/response.UnauthorizedResponse'
        "404":
          description: Configuration not found
          schema:
            $ref: '#/definitions/response.NotFoundResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.InternalErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Delete SMTP configuration
      tags:
      - SMTP Config
    get:
      description: Fetches specific SMTP configuration details by numeric ID
      parameters:
      - description: SMTP Config ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: SMTP configuration details
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.SMTPConfigResponse'
              type: object
        "400":
          description: Invalid ID format
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Invalid or missing API authentication credentials
          schema:
            $ref: '#/definitions/response.UnauthorizedResponse'
        "404":
          description: Configuration not found
          schema:
            $ref: '#/definitions/response.NotFoundResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.InternalErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get SMTP configuration by ID
      tags:
      - SMTP Config
    put:
      consumes:
      - application/json
      description: Updates fields of an existing SMTP configuration
      parameters:
      - description: SMTP Config ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/model.UpdateSMTPConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: SMTP configuration updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.SMTPConfigResponse'
              type: object
        "400":
          description: Invalid input data or validation error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Invalid or missing API authentication credentials
          schema:
            $ref: '#/definitions/response.UnauthorizedResponse'
        "404":
          description: Configuration not found
          schema:
            $ref: '#/definitions/response.NotFoundResponse'
        "409":
          description: Configuration name conflict
          schema:
            $ref: '#/definitions/response.ConflictResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.InternalErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Update SMTP configuration
      tags:
      - SMTP Config
  /api/v1/smtp-configs/{id}/default:
    put:
      description: Sets target configuration as active default for outbound email
        fallback
      parameters:
      - description: SMTP Config ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Configuration set as default
          schema:
            $ref: '#/definitions/response.SimpleResponse'
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Invalid or missing API authentication credentials
          schema:
            $ref: '#/definitions/response.UnauthorizedResponse'
        "404":
          description: Configuration not found
          schema:
            $ref: '#/definitions/response.NotFoundResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.InternalErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Set SMTP configuration as system default
      tags:
      - SMTP Config
  /api/v1/smtp-configs/{id}/test:
    post:
      description: Pings and tests authentication with the specified SMTP host
      parameters:
      - description: SMTP Config ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: SMTP connection successful
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.TestConnectionResponse'
              type: object
        "400":
          description: Invalid ID or SMTP handshake failure
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Invalid or missing API authentication credentials
          schema:
            $ref: '#/definitions/response.UnauthorizedResponse'
        "404":
          description: Configuration not found
          schema:
            $ref: '#/definitions/response.NotFoundResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.InternalErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Test SMTP connection
      tags:
      - SMTP Config
  /health:
    get:
      description: Returns uptime status and health of the central SMTP sender service
      produces:
      - application/json
      responses:
        "200":
          description: Service is healthy
          schema:
            $ref: '#/definitions/response.HealthResponse'
      summary: Service health check
      tags:
      - Health
schemes:
- http
- https
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-Key
    type: apiKey
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: User authentication, token renewal, and profile operations
  name: Auth
- description: Service health and readiness operations
  name: Health
- description: Management and testing of SMTP server configurations
  name: SMTP Config
- description: Centralized email dispatch endpoint
  name: Emails
